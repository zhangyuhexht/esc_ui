# EscUI menu config (2.0)
#
# menu.entries is the contents of the "Server Links" dialog in the ESC menu.
# Each entry is one button: label = button text, url = page to open.
# show-rules: true is also supported to display in-game text (needs a rules section; unused by default).
#
# Menu changes take effect after a server restart.

menu:
  title: "服务器链接"          # dialog title
  button: "服务器链接"         # ESC menu button label
  columns: 1                  # button columns (1–4)
  entries:
    - label: "服务器官网"
      url: "https://zhangyuhexht.top/"
    - label: "服务器文档"
      url: "https://zhangyuhexht.top/#/docs"
    - label: "粘液科技信息"
      url: "https://zhangyuhexht.top/#/slime"
    - label: "服务器规则"
      url: "https://zhangyuhexht.top/#/rules"
    - label: "反馈/提议"
      url: "https://zhangyuhexht.top/#/feedback"
